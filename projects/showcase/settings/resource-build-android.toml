    "project/scripts/modules/destruction.ts",
    "project/scenes/destruction.scene",
    "project/scripts/modules/minimal.ts",
    "project/scripts/modules/apartment.ts",
    "project/scripts/modules/courtyard.ts",
    "project/scenes/main.scene",
    "project/scenes/apartment.scene",
    "project/scenes/playground.scene",
    "project/models/skeleton.fbx",
    "project/models/locomotions.fbx/animations/walk",
