plugins {
    id 'com.android.application'
}

def nativeConfiguration = providers.gradleProperty('engineConfiguration').getOrElse('debug')
if (!(nativeConfiguration in ['debug', 'release'])) {
    throw new GradleException('engineConfiguration must be debug or release')
}
def nativeDirectory = file("../../../build/android-arm64-${nativeConfiguration}/android")
layout.buildDirectory.set(file("../../../build/android-gradle/${nativeConfiguration}"))

android {
    namespace = 'org.engine.minimal'
    compileSdk = 35
    buildToolsVersion = '36.1.0'
    ndkVersion = '27.2.12479018'
    ndkPath = System.getenv('ANDROID_NDK_HOME')
    defaultConfig {
        applicationId = 'org.engine.minimal'
        minSdk = 28
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    sourceSets {
        main {
            java.srcDir new File(nativeDirectory, 'java')
            jniLibs.srcDir new File(nativeDirectory, 'jniLibs')
            assets.srcDir new File(nativeDirectory, 'assets')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable = true
        }
        release {
            minifyEnabled = false
            // 此阶段的 Release APK 仅供本地测试，使用本机生成的调试签名。
            signingConfig = signingConfigs.debug
        }
    }
}

androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.enable = variant.buildType == nativeConfiguration
    }
}

tasks.named('preBuild') {
    doFirst {
        ['jniLibs/arm64-v8a/libmain.so', 'jniLibs/arm64-v8a/libSDL3.so',
         'jniLibs/arm64-v8a/libc++_shared.so', 'java/org/libsdl/app/SDLActivity.java',
         'assets/v8/icudtl.dat'].each { relative ->
            File input = new File(nativeDirectory, relative)
            if (!input.isFile() || input.length() == 0) {
                throw new GradleException("Missing ${relative}; build CMake preset android-arm64-${nativeConfiguration} first")
            }
        }
    }
}
